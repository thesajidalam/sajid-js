
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#1c1250"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172c50"/>
      <stop offset="1" stop-color="#17143e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="550" cy="45" r="175" fill="#8b5cf6" opacity=".07"/>
  <circle cx="55" cy="340" r="190" fill="#22d3ee" opacity=".06"/>

  <!-- Ambient glow -->
  <ellipse cx="320" cy="145" rx="150" ry="100"
           fill="#6366f1" opacity=".18" filter="url(#glow)"/>

  <!-- JSON editor -->
  <g transform="translate(320 140)">
    <rect x="-116" y="-91" width="232" height="180"
          rx="22" fill="url(#panel)"
          stroke="url(#accent)" stroke-width="2.5"/>

    <rect x="-116" y="-91" width="232" height="180"
          rx="22" fill="url(#shine)"/>

    <!-- Window header -->
    <path d="M-94 -91 H94 Q116 -91 116 -69 V-57 H-116 V-69 Q-116 -91 -94 -91Z"
          fill="#fff" opacity=".055"/>

    <circle cx="-92" cy="-74" r="4" fill="#22d3ee"/>
    <circle cx="-78" cy="-74" r="4" fill="#8b5cf6"/>
    <circle cx="-64" cy="-74" r="4" fill="#64748b"/>

    <!-- JSON brackets -->
    <text x="-83" y="-14" font-family="monospace"
          font-size="59" font-weight="bold" fill="#22d3ee">{</text>

    <text x="50" y="-14" font-family="monospace"
          font-size="59" font-weight="bold" fill="#a78bfa">}</text>

    <!-- Forge hammer -->
    <g transform="translate(0 -37) rotate(-42)">
      <rect x="-5" y="-1" width="10" height="43"
            rx="4" fill="url(#accent)"/>
      <path d="M-18 -13 H18 L22 -2 H-22Z"
            fill="url(#accent)"/>
      <path d="M-14 -21 H14 V-13 H-14Z"
            fill="#22d3ee"/>
    </g>

    <!-- Code lines -->
    <g font-family="monospace" font-size="10">
      <text x="-74" y="17" fill="#64748b">01</text>
      <text x="-53" y="17" fill="#e0e7ff">{</text>
      <text x="-74" y="35" fill="#64748b">02</text>
      <text x="-53" y="35" fill="#22d3ee">"json"</text>
      <text x="-13" y="35" fill="#e0e7ff">:</text>
      <text x="-5" y="35" fill="#a78bfa">"forge"</text>
      <text x="43" y="35" fill="#e0e7ff">,</text>
      <text x="-74" y="53" fill="#64748b">03</text>
      <text x="-53" y="53" fill="#22d3ee">"valid"</text>
      <text x="-10" y="53" fill="#e0e7ff">:</text>
      <text x="0" y="53" fill="#34d399">true</text>
      <text x="27" y="53" fill="#e0e7ff">}</text>
    </g>
  </g>

  <!-- Feature indicators -->
  <g font-family="Arial,sans-serif" font-size="10"
     font-weight="600" text-anchor="middle">

    <g transform="translate(104 102)">
      <rect width="92" height="25" rx="8"
            fill="#22d3ee" opacity=".13"
            stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="46" y="16" fill="#67e8f9">FORMAT</text>
    </g>

    <g transform="translate(444 102)">
      <rect width="92" height="25" rx="8"
            fill="#8b5cf6" opacity=".13"
            stroke="#8b5cf6" stroke-opacity=".65"/>
      <text x="46" y="16" fill="#c4b5fd">VALIDATE</text>
    </g>

    <g transform="translate(91 140)">
      <rect width="105" height="25" rx="8"
            fill="#22d3ee" opacity=".13"
            stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="52" y="16" fill="#67e8f9">TREE VIEW</text>
    </g>

    <g transform="translate(444 140)">
      <rect width="92" height="25" rx="8"
            fill="#8b5cf6" opacity=".13"
            stroke="#8b5cf6" stroke-opacity=".65"/>
      <text x="46" y="16" fill="#c4b5fd">DIFF</text>
    </g>

    <g transform="translate(104 178)">
      <rect width="92" height="25" rx="8"
            fill="#22d3ee" opacity=".13"
            stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="46" y="16" fill="#67e8f9">CONVERT</text>
    </g>

    <g transform="translate(444 178)">
      <rect width="92" height="25" rx="8"
            fill="#8b5cf6" opacity=".13"
            stroke="#8b5cf6" stroke-opacity=".65"/>
      <text x="46" y="16" fill="#c4b5fd">6 THEMES</text>
    </g>
  </g>

  <!-- Brand -->
  <text x="320" y="264" text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="35" font-weight="750"
        fill="#fff" letter-spacing="-1">Json<tspan fill="url(#accent)">Forge</tspan></text>

  <rect x="274" y="278" width="92" height="3"
        rx="1.5" fill="url(#accent)"/>

  <text x="320" y="305" text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="13" font-weight="600"
        fill="#c4b5fd">PROFESSIONAL JSON TOOLKIT</text>

  <text x="320" y="329" text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="11" fill="#94a3b8">FORMAT • VALIDATE • TRANSFORM • INSPECT</text>
</svg>
